<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanças | Revolut Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-light: #1c1c1e;
            --accent: #1977f2; /* Revolut Blue */
            --green: #00d44b;
            --red: #ff3b30;
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
            --border: #2c2c2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg);
            color: var(--text-main); 
            font-family: 'Exo 2', sans-serif; 
            max-width: 430px; 
            margin: 0 auto;
            overflow: hidden;
        }

        /* Container Principal */
        .app-shell {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 120px;
        }

        /* HEADER REVOLUT STYLE */
        .rev-header {
            padding: 40px 16px 20px;
            background: transparent;
            backdrop-filter: none;
            border-bottom: none;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .profile-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .avatar-circle {
            width: 36px;
            height: 36px;
            background: var(--surface-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
        }

        .main-balance-container {
            text-align: center;
            padding: 10px 0 30px;
        }

        .main-balance-label {
            font-size: 14px;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .main-balance-amount {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .main-balance-summary {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            backdrop-filter: none;
            color: rgba(255,255,255,0.8);
        }

        .main-balance-sub {
            font-size: 13px;
            line-height: 1.4;
        }

        /* CARDS & WIDGETS */
        .quick-actions {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.1);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.05);
            transform: translateY(-1px);
        }

        .action-icon {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: rgba(255,255,255,0.75);
            transition: 0.2s;
        }

        .action-btn:active .action-icon { background: var(--border); transform: scale(0.9); }

        /* LISTS */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .section-title { font-size: 17px; font-weight: 700; }
        .section-summary { font-size: 14px; color: var(--text-secondary); margin: 0 4px 10px; }
        .section-summary.highlight-strong { color: white; font-weight: 700; background: rgba(255,255,255,0.12); padding: 14px 16px; border-radius: 18px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(18px); }
        .see-all { color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; }

        .rev-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 4px 0;
            margin-bottom: 24px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 15px 40px rgba(0,0,0,0.14);
            backdrop-filter: blur(16px);
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            gap: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .list-item:last-child { border-bottom: none; }

        .item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: inset 0 2px 8px rgba(255,255,255,0.08), 0 8px 18px rgba(0,0,0,0.14);
        }

        .item-info { flex: 1; overflow: hidden; }
        .item-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; color: rgba(255,255,255,0.9); }
        .item-sub { font-size: 13px; color: rgba(255,255,255,0.68); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .item-values { text-align: right; }
        .item-val { font-size: 15px; font-weight: 700; }
        .item-val.neg { color: var(--text-main); }
        .item-val.pos { color: var(--white); }
        .item-action {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
        }
        .item-menu {
            position: fixed;
            display: none;
            min-width: 120px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            z-index: 300;
            overflow: hidden;
        }
        .item-menu.open { display: block; }
        .item-menu button {
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
        }
        .item-menu button:hover { background: rgba(255,255,255,0.06); }

        /* BOTTOM NAV BAR */
        .nav-bar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.30);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(24px);
            border-radius: 999px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.28);
            z-index: 100;
        }

        .nav-item {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            color: rgba(255,255,255,0.85);
            cursor: pointer;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .nav-item:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); box-shadow: 0 12px 18px rgba(0,0,0,0.18); }
        .nav-item.active { background: rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 12px 18px rgba(0,0,0,0.22); color: white; }
        .nav-icon { font-size: 20px; }

        /* RENDIMENTOS ESPECÍFICO */
        .grid-rend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }
        .rend-card.grid-rend {
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .rend-card.grid-rend:hover {
            background: rgba(255,255,255,0.06);
        }
        .rend-box {
            background: var(--surface-light);
            padding: 16px;
            border-radius: 16px;
        }
        .rend-lbl { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
        .rend-val { font-size: 16px; font-weight: 700; }
        .rend-input,
        .rend-name-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
            color: white;
            font-family: inherit;
            outline: none;
        }
        .rend-input { font-weight: 700; text-align: right; }
        .rend-name-input { font-weight: 700; margin-bottom: 8px; }

        .rend-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 15px 40px rgba(0,0,0,0.14);
            backdrop-filter: blur(16px);
            margin-bottom: 24px;
        }
        .rend-table th {
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            text-align: right;
            letter-spacing: 0.04em;
        }
        .rend-table th:first-child { text-align: left; }
        .rend-table td {
            padding: 14px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.88);
        }
        .rend-table td:first-child { text-align: left; color: white; font-weight: 700; }
        .rend-table td input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            text-align: right;
            font-weight: 600;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        .rend-table td input:focus {
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 2px 4px;
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 8px 24px rgba(25, 119, 242, 0.3);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            align-items: flex-end;
        }
        .modal-overlay.open { display: flex; }
        .modal-sheet {
            width: 100%;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            padding: 24px 16px 40px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, select {
            width: 100%;
            background: var(--surface-light);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            margin-bottom: 16px;
            outline: none;
        }
        .btn-main {
            width: 100%;
            background: var(--text-main);
            color: black;
            padding: 16px;
            border-radius: 30px;
            font-weight: 700;
            border: none;
            margin-top: 10px;
        }

        .splash-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-family: 'Exo 2', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            opacity: 1;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        .splash-overlay.hide {
            opacity: 0;
        }
    </style>
</head>
<body>
<div class="splash-overlay" id="splashScreen">POUPANÇA</div>

<div class="app-shell">
    <header class="rev-header">
        <div class="main-balance-container">
            <div class="main-balance-label">PATRIMÓNIO TOTAL</div>
            <div class="main-balance-amount" id="headerBalance">0,00 €</div>
            <div class="main-balance-summary">
                <div class="main-balance-sub">Com Fundo <span id="balanceWithFundo">0,00 €</span></div>
                <div class="main-balance-sub">Projetado <span id="projectedBalance">0,00 €</span></div>
                <div class="main-balance-sub">10% = <span id="tenPercent">0,00 €</span></div>
            </div>
        </div>

        <div class="quick-actions">
            <button class="action-btn" onclick="openAddModal()">
                <div class="action-icon" style="background: var(--border); color: var(--text-main);">+</div>
                <span>Adicionar</span>
            </button>
        </div>
    </header>

    <main class="scroll-area" id="mainContent">
        <!-- O conteúdo será injetado pelo JS -->
    </main>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchTab('extrato', this)">
            <span class="nav-icon">🏠</span>
        </div>
        <div class="nav-item" onclick="switchTab('fundo', this)">
            <span class="nav-icon">🛡️</span>
        </div>
        <div class="nav-item" onclick="switchTab('pendentes', this)">
            <span class="nav-icon">💰</span>
        </div>
        <div class="nav-item" onclick="switchTab('rendimentos', this)">
            <span class="nav-icon">💼</span>
        </div>
    </nav>
</div>

<!-- MODAL ADD/EDIT -->
<div class="modal-overlay" id="addModal">
    <div class="modal-sheet">
        <h3 id="modalTitle" style="margin-bottom: 20px;">Novo Registo</h3>
        <input type="text" id="f_origem" placeholder="Nome ou Origem">
        <div id="modalInputs"></div>
        <button class="btn-main" onclick="saveItem()">Confirmar</button>
        <button class="btn-main" style="background: transparent; color: var(--text-secondary);" onclick="closeModal('addModal')">Cancelar</button>
    </div>
</div>
<div class="item-menu" id="itemMenu">
    <button type="button" id="itemMenuEdit" onclick="menuEdit()">Editar</button>
    <button type="button" id="itemMenuDelete" onclick="menuDelete()">Eliminar</button>
</div>

<script>
    // Dados iniciais (como no teu código)
    let data = JSON.parse(localStorage.getItem('financas_data_rev') || 'null') || {
        currentYear: 2026,
        extrato: [
            { id: 1, origem: 'Revolut 2,5%', obs: 'Francisco', credito: 4852, debito: 0, color: '#1977f2' },
            { id: 2, origem: 'Millennium', obs: 'Maria João', credito: 6000, debito: 0, color: '#ff3b30' },
            { id: 3, origem: 'ETF Portfolio', obs: 'Ações Globais', credito: 180, debito: 0, color: '#00d44b' },
        ],
        fundo: [
            { id: 1, origem: 'Certificados Aforro', valor: 2886.31, color: '#ff9500' },
        ],
        pendentes: [
            { id: 1, origem: 'Ajudas Mãe', valor: 1100, pago: false, color: '#ff9500' },
            { id: 2, origem: 'IRS Mensal', valor: 1635, pago: false, color: '#a855f7' },
        ],
        rendimentos: [
            { id: 1, origem: 'Francisco', liqMensal: 1517.38, sAlim: 230.12, color: '#1977f2' },
            { id: 2, origem: 'Maria João', liqMensal: 1293, sAlim: 224.40, color: '#ff3b30' },
        ]
    };

    let currentTab = 'extrato';
    let editingType = null;
    let editingId = null;
    let pendingActionId = null;
    let itemMenuType = null;
    let itemMenuId = null;

    function save() { localStorage.setItem('financas_data_rev', JSON.stringify(data)); }
    function fmt(n) { return new Intl.NumberFormat('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n || 0).replace(/\u00A0/g, ' ') + '€'; }

    function parseCurrencyValue(value) {
        const cleaned = String(value).replace(/\s/g, '').replace('€', '').replace(/\./g, '').replace(',', '.');
        return parseFloat(cleaned);
    }

    function updateRendimentoField(id, field, value) {
        const item = data.rendimentos.find(r => r.id === id);
        if (!item) return;
        if (field === 'origem') {
            item.origem = value;
        } else {
            const parsed = parseCurrencyValue(value);
            if (isNaN(parsed)) return;
            item[field] = parsed;
        }
        save();
        renderContent();
    }

    function hideSplash() {
        const splash = document.getElementById('splashScreen');
        if (!splash) return;
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 400);
    }

    function openItemMenu(type, id, event) {
        event.stopPropagation();
        itemMenuType = type;
        itemMenuId = id;
        const menu = document.getElementById('itemMenu');
        const rect = event.currentTarget.getBoundingClientRect();
        menu.style.top = `${rect.bottom + 8}px`;
        menu.style.left = `${rect.left}px`;
        menu.classList.add('open');
    }

    function closeItemMenu() {
        const menu = document.getElementById('itemMenu');
        menu.classList.remove('open');
        itemMenuType = null;
        itemMenuId = null;
    }

    function menuEdit() {
        if (!itemMenuType || !itemMenuId) return;
        const type = itemMenuType;
        const id = itemMenuId;
        closeItemMenu();
        openEditModal(type, id);
    }

    function menuDelete() {
        if (!itemMenuType || !itemMenuId) return;
        const target = data[itemMenuType].findIndex(i => i.id === itemMenuId);
        if (target === -1) return;
        data[itemMenuType].splice(target, 1);
        closeItemMenu();
        save();
        renderContent();
    }

    document.addEventListener('click', closeItemMenu);

    function switchTab(tab, el) {
        currentTab = tab;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        renderContent();
    }

    function renderContent() {
        const container = document.getElementById('mainContent');
        const patrimonioTotal = data.extrato.reduce((s, r) => s + (r.credito - r.debito), 0);
        const pendingTotal = data.pendentes.filter(r => !r.pago).reduce((s, r) => s + r.valor, 0);
        const fundoTotal = data.fundo.reduce((s, r) => s + r.valor, 0);
        const rendimentosTotal = data.rendimentos.reduce((s, r) => s + r.liqMensal + r.sAlim, 0);

        document.getElementById('headerBalance').textContent = fmt(patrimonioTotal);
        document.getElementById('balanceWithFundo').textContent = fmt(patrimonioTotal + fundoTotal);
        document.getElementById('projectedBalance').textContent = fmt(patrimonioTotal + fundoTotal + pendingTotal);
        document.getElementById('tenPercent').textContent = fmt(patrimonioTotal * 0.1);

        let html = '';

        if (currentTab === 'extrato') {
            html += `<div class="section-summary highlight-strong">Total Poupança ${fmt(patrimonioTotal)}</div>`;
            html += `<div class="rev-card">`;
            data.extrato.forEach(r => {
                html += `
                <div class="list-item">
                    <div class="item-icon" style="background: var(--green)">💰</div>
                    <div class="item-info">
                        <div class="item-name">${r.origem}</div>
                        <div class="item-sub">${r.obs}</div>
                    </div>
                    <div class="item-values">
                        <div class="item-val">${fmt(r.credito - r.debito)}</div>
                    </div>
                    <button class="item-action" onclick="openItemMenu('extrato', ${r.id}, event)">⋮</button>
                </div>`;
            });
            html += `</div>`;
        }

        if (currentTab === 'fundo') {
            html += `<div class="section-summary highlight-strong">Total Fundo ${fmt(fundoTotal)}</div>`;
            html += `<div class="rev-card">`;
            data.fundo.forEach(r => {
                html += `
                <div class="list-item">
                    <div class="item-icon" style="background: ${r.color}">💰</div>
                    <div class="item-info">
                        <div class="item-name">${r.origem}</div>
                        <div class="item-sub">Fundo de Emergência</div>
                    </div>
                    <div class="item-values">
                        <div class="item-val pos">${fmt(r.valor)}</div>
                    </div>
                    <button class="item-action" onclick="openItemMenu('fundo', ${r.id}, event)">⋮</button>
                </div>`;
            });
            html += `</div>`;
        }

        if (currentTab === 'pendentes') {
            html += `<div class="section-summary highlight-strong">Total Pendente ${fmt(pendingTotal)}</div>`;
            html += `<div class="rev-card">`;
            data.pendentes.forEach(r => {
                html += `
                <div class="list-item">
                    <div class="item-icon" style="background: ${r.pago ? 'var(--border)' : 'var(--red)'}">💰</div>
                    <div class="item-info">
                        <div class="item-name" style="${r.pago ? 'text-decoration: line-through; opacity: 0.5;' : ''}">${r.origem}</div>
                        <div class="item-sub">${r.pago ? 'Pago' : 'Pendente'}</div>
                    </div>
                    <div class="item-values">
                        <div class="item-val neg">${fmt(r.valor)}</div>
                        <div class="see-all" onclick="handlePendenteAction(${r.id})" style="font-size:11px">${r.pago ? 'Anular' : 'Marcar Pago'}</div>
                    </div>
                    <button class="item-action" onclick="openItemMenu('pendentes', ${r.id}, event)">⋮</button>
                </div>`;
            });
            html += `</div>`;
        }

        if (currentTab === 'rendimentos') {
            html += `<div class="section-summary highlight-strong">Total Rendimento ${fmt(rendimentosTotal)}</div>`;
            
            let totalVUni = 0;
            let totalSAlim = 0;
            data.rendimentos.forEach(r => {
                totalVUni += r.liqMensal;
                totalSAlim += r.sAlim;
            });
            const esforcoTotal = ((totalVUni * 14) / 12) + totalSAlim;
            const tx30Total = esforcoTotal * 0.30;
            
            html += `<table class="rend-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>V. Uni</th>
                        <th>S. Alim</th>
                        <th>L. Mensal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>`;
            
            data.rendimentos.forEach(r => {
                const liqMensal = r.liqMensal + r.sAlim;
                html += `
                    <tr>
                        <td>${r.origem}</td>
                        <td><input type="text" inputmode="decimal" value="${fmt(r.liqMensal)}" onchange="updateRendimentoField(${r.id}, 'liqMensal', this.value)"></td>
                        <td><input type="text" inputmode="decimal" value="${fmt(r.sAlim)}" onchange="updateRendimentoField(${r.id}, 'sAlim', this.value)"></td>
                        <td>${fmt(liqMensal)}</td>
                        <td><button class="item-action" onclick="openItemMenu('rendimentos', ${r.id}, event)">⋮</button></td>
                    </tr>`;
            });
            
            html += `
                    <tr style="border-top: 2px solid rgba(255,255,255,0.12);">
                        <td colspan="3" style="text-align: left; font-weight: 700;">P. TX ESFORÇO</td>
                        <td>${fmt(esforcoTotal)}</td>
                    </tr>
                    <tr>
                        <td colspan="3" style="text-align: left; font-weight: 700;">TX ESFORÇO 30%</td>
                        <td>${fmt(tx30Total)}</td>
                    </tr>`;
            
            html += `</tbody>
            </table>`;
        }

        container.innerHTML = html;
    }

    function handlePendenteAction(id) {
        const item = data.pendentes.find(p => p.id === id);
        if (!item) return;
        if (item.pago) {
            item.pago = false;
            save();
            renderContent();
            return;
        }

        pendingActionId = id;
        editingType = null;
        editingId = null;
        document.getElementById('modalTitle').textContent = 'Liquidar Pendente';
        document.getElementById('f_origem').value = item.origem;
        document.getElementById('modalInputs').innerHTML = `
            <input type="number" id="f_valor" placeholder="Valor €" step="0.01" value="${item.valor}">
            <div style="margin-bottom:16px;">
                <select id="f_destino" onchange="toggleDestino()">
                    <option value="novo">Novo movimento</option>
                    <option value="reforcar">Reforçar conta existente</option>
                </select>
            </div>
            <div id="modalExtra"></div>
        `;
        toggleDestino();
        document.getElementById('addModal').classList.add('open');
    }

    function toggleDestino() {
        const destino = document.getElementById('f_destino').value;
        const extra = document.getElementById('modalExtra');
        if (destino === 'reforcar') {
            const options = data.extrato.map(r => `<option value="${r.id}">${r.origem}</option>`).join('');
            extra.innerHTML = `<select id="f_existing">${options}</select>`;
        } else {
            extra.innerHTML = '';
        }
    }

    function openEditModal(type, id) {
        editingType = type;
        editingId = id;
        pendingActionId = null;
        const item = data[type].find(i => i.id === id);
        if (!item) return;

        document.getElementById('modalTitle').textContent = 'Editar';
        document.getElementById('f_origem').value = item.origem || '';

        let inputs = '';
        if (type === 'extrato') {
            inputs = `
                <input type="number" id="f_valor" placeholder="Valor €" step="0.01" value="${item.credito - item.debito}">
                <input type="text" id="f_obs" placeholder="Observações" value="${item.obs || ''}">
            `;
        } else if (type === 'fundo') {
            inputs = `
                <input type="number" id="f_valor" placeholder="Valor €" step="0.01" value="${item.valor}">
            `;
        } else if (type === 'pendentes') {
            inputs = `
                <input type="number" id="f_valor" placeholder="Valor €" step="0.01" value="${item.valor}">
                <select id="f_pago">
                    <option value="false" ${item.pago ? '' : 'selected'}>Pendente</option>
                    <option value="true" ${item.pago ? 'selected' : ''}>Pago</option>
                </select>
            `;
        } else if (type === 'rendimentos') {
            inputs = `
                <input type="number" id="f_liqMensal" placeholder="Líquido" step="0.01" value="${item.liqMensal}">
                <input type="number" id="f_sAlim" placeholder="Subsídio" step="0.01" value="${item.sAlim}">
            `;
        }

        document.getElementById('modalInputs').innerHTML = inputs;
        document.getElementById('addModal').classList.add('open');
    }

    function saveItem() {
        const origem = document.getElementById('f_origem').value;
        const tipo = editingType || currentTab;

        if (!origem) return alert('Preencha os dados');

        if (pendingActionId) {
            const valor = parseFloat(document.getElementById('f_valor').value);
            if (isNaN(valor)) return alert('Preencha os dados');
            const pendente = data.pendentes.find(p => p.id === pendingActionId);
            const destino = document.getElementById('f_destino') ? document.getElementById('f_destino').value : 'novo';
            if (destino === 'reforcar') {
                const existingId = parseInt(document.getElementById('f_existing').value, 10);
                const conta = data.extrato.find(e => e.id === existingId);
                if (conta) {
                    conta.credito += valor;
                    conta.obs = conta.obs || 'Reforço';
                }
            } else {
                const newItem = { id: Date.now(), origem, color: '#1977f2', credito: valor, debito: 0, obs: pendente ? pendente.origem : 'Pendente pago' };
                data.extrato.push(newItem);
            }
            if (pendente) pendente.pago = true;
            pendingActionId = null;
        } else if (editingId) {
            const item = data[editingType].find(i => i.id === editingId);
            if (!item) return;
            item.origem = origem;
            if (editingType === 'extrato') {
                const valor = parseFloat(document.getElementById('f_valor').value);
                item.credito = isNaN(valor) ? item.credito : valor;
                item.debito = 0;
                item.obs = document.getElementById('f_obs').value || item.obs || '';
            } else if (editingType === 'fundo') {
                const valor = parseFloat(document.getElementById('f_valor').value);
                item.valor = isNaN(valor) ? item.valor : valor;
            } else if (editingType === 'pendentes') {
                const valor = parseFloat(document.getElementById('f_valor').value);
                item.valor = isNaN(valor) ? item.valor : valor;
                item.pago = document.getElementById('f_pago').value === 'true';
            } else if (editingType === 'rendimentos') {
                const liqMensal = parseFloat(document.getElementById('f_liqMensal').value);
                const sAlim = parseFloat(document.getElementById('f_sAlim').value);
                item.liqMensal = isNaN(liqMensal) ? item.liqMensal : liqMensal;
                item.sAlim = isNaN(sAlim) ? item.sAlim : sAlim;
            }
            editingId = null;
            editingType = null;
        } else {
            let newItem = { id: Date.now(), origem, color: '#1977f2' };
            if (tipo === 'extrato') {
                const valor = parseFloat(document.getElementById('f_valor').value);
                if (isNaN(valor)) return alert('Preencha os dados');
                newItem.credito = valor;
                newItem.debito = 0;
                newItem.obs = 'Manual';
                data.extrato.push(newItem);
            } else if (tipo === 'fundo') {
                const valor = parseFloat(document.getElementById('f_valor').value);
                if (isNaN(valor)) return alert('Preencha os dados');
                newItem.valor = valor;
                newItem.pago = false;
                data.fundo.push(newItem);
            } else if (tipo === 'pendentes') {
                const valor = parseFloat(document.getElementById('f_valor').value);
                if (isNaN(valor)) return alert('Preencha os dados');
                newItem.valor = valor;
                newItem.pago = false;
                data.pendentes.push(newItem);
            } else if (tipo === 'rendimentos') {
                const liqMensal = parseFloat(document.getElementById('f_liqMensal').value);
                const sAlim = parseFloat(document.getElementById('f_sAlim').value);
                if (isNaN(liqMensal) || isNaN(sAlim)) return alert('Preencha os dados');
                newItem.liqMensal = liqMensal;
                newItem.sAlim = sAlim;
                data.rendimentos.push(newItem);
            }
        }

        save();
        closeModal('addModal');
        renderContent();
    }

    // Modal Handlers simplificados
    function openAddModal() {
        editingType = null;
        editingId = null;
        pendingActionId = null;
        document.getElementById('modalTitle').textContent = "Novo Registo";
        document.getElementById('f_origem').value = '';

        let fields = '';
        if (currentTab === 'extrato') {
            fields = `
                <input type="number" id="f_valor" placeholder="Valor €" step="0.01">
                <input type="text" id="f_obs" placeholder="Observações">
            `;
        } else if (currentTab === 'fundo') {
            fields = `
                <input type="number" id="f_valor" placeholder="Valor €" step="0.01">
            `;
        } else if (currentTab === 'pendentes') {
            fields = `
                <input type="number" id="f_valor" placeholder="Valor €" step="0.01">
            `;
        } else if (currentTab === 'rendimentos') {
            fields = `
                <input type="number" id="f_liqMensal" placeholder="Líquido" step="0.01">
                <input type="number" id="f_sAlim" placeholder="Subsídio" step="0.01">
            `;
        }

        document.getElementById('modalInputs').innerHTML = fields;
        document.getElementById('addModal').classList.add('open');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    // Poupança
    renderContent();
    setTimeout(hideSplash, 600);
</script>
